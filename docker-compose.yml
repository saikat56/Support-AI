services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: support_ai_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: support_ai
      DB_USERNAME: postgres
      DB_PASSWORD: secretpassword
    depends_on:
      db:
        condition: service_healthy
    networks:
      - support_ai_network

  web:
    image: nginx:alpine
    container_name: support_ai_web
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - support_ai_network

  db:
    image: postgres:16-alpine
    container_name: support_ai_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: support_ai
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secretpassword
    ports:
      - "${FORWARD_DB_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d support_ai"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - support_ai_network

  # DbGate - Modern Web Database Manager for PostgreSQL
  dbgate:
    image: dbgate/dbgate:latest
    container_name: support_ai_dbgate
    restart: unless-stopped
    ports:
      - "8080:3000"
    environment:
      CONNECTIONS: con_postgres
      LABEL_con_postgres: "Support AI (Postgres)"
      ENGINE_con_postgres: postgres@dbgate-plugin-postgres
      SERVER_con_postgres: db
      PORT_con_postgres: 5432
      USER_con_postgres: postgres
      PASSWORD_con_postgres: secretpassword
      DATABASE_con_postgres: support_ai
    depends_on:
      db:
        condition: service_healthy
    networks:
      - support_ai_network

volumes:
  postgres_data:
    driver: local

networks:
  support_ai_network:
    driver: bridge

